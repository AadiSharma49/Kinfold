# Production compose file. Run on the server itself, not your laptop.
#
# Differences from docker-compose.yml (local dev):
#   - Postgres/Redis ports are NOT published to the host's public network
#     interface — only reachable from other containers on this compose
#     network. The dev file publishes them for convenience; that would be a
#     real exposure on a public server.
#   - Adds the `api` service itself (dev runs it with `uv run uvicorn`
#     directly on your machine instead).
#   - Adds Caddy for automatic HTTPS. Set CADDY_DOMAIN in your server's .env
#     to your real domain before starting this.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api uv run alembic upgrade head

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinfold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: kinfold
    volumes:
      - kinfold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinfold -d kinfold"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - kinfold_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://kinfold:${POSTGRES_PASSWORD}@postgres:5432/kinfold
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Docker-outside-of-Docker: lets the API spawn sandbox containers as
      # siblings on the host, not nested inside this container. Equivalent
      # to root on the host — see apps/api/Dockerfile's top comment.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set your real domain in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  kinfold_pgdata:
  kinfold_redisdata:
  caddy_data:
  caddy_config:
