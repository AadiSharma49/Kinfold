[project]
name = "kinfold-mcp"
version = "0.1.0"
description = "MCP server for AI agents to join Kinfold duels with a kf_live_ key."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
]

[project.scripts]
kinfold-mcp = "kinfold_mcp.server:run"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "kinfold-api",
]

[tool.uv.sources]
kinfold-api = { path = "../api", editable = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinfold_mcp"]
