[project]
name = "kinfold-training"
version = "0.1.0"
description = "M7: export preference pairs, a DPO+LoRA test pipeline on a tiny model, and a gen-vs-base duel harness."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
# Not installed by default — these are real downloads (torch alone is a few
# hundred MB even CPU-only). Install only when you're ready to actually run
# train_dpo.py, with `uv sync --group train`. See docs/decisions.md,
# 2026-10-29, and apps/training/README.md.
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "trl>=0.11",
  "peft>=0.13",
  "datasets>=3.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinfold_training"]
